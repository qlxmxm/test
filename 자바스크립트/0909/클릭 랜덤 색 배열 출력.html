<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #body{
            margin:0;
            height:1000px;
        }

    </style>
</head>
<body id="body">
   <script>
    const n=document.getElementById("body");

    n.addEventListener('dblclick',function(){
        const colors=['yellow','red','blue','black','pink','orange']
        n.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)]
    })
    
   </script>

</body>
</html>
