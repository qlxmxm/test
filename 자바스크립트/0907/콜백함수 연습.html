   <script>

   //콜백 : 다른 함수의 인자로 전달됨 -> 함수안에서 호출되는 함수
   function fun1(name, callback){
    console.log(name);
    callback;
   }

   function fun2(){
    console.log('hi');
   }

   fun1('tom', fun2);

/*

*/
    //콜백함수 구조만 보고있음
    function func1(num,callback){
        for(let i=1;i<=num;i++){
            callback(i);
        }
    }
    
    func1(5,(i)=>{
        console.log(i);
    })

    func1(5,(i)=>{
        console.log(i*5);
    })




   </script>
