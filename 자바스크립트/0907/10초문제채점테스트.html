<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
  <h1>문제는 자동으로 생성되며, 10초가 지나면 자동 채점</h1>
  <p>남은시간 <span id="timer">10</span></p>
  <hr>

  <!-- 문제 생성 div-->
  <div id="quizList"></div>

  <button id="retryBtn">다시</button>
  정답: <span id="correctCount">0</span>개

  <script>
    //문제 4개
    const QUESTION_COUNT = 4;
    //제한시간
    const TIME_LIMIT = 10;

    //만들어진 문제들을 저장할 배열
    let questions = [];
    //현재 남은시간
    let timeLeft = TIME_LIMIT;

    //1~100 사이 랜덤 숫자
    function getRandomNum() {
      return Math.floor(Math.random() * 100) + 1;
    }

    //질문을 만드는 함수 선언
    function makeQuestion() {
      let num1 = getRandomNum(); //1~100랜덤숫자
      let num2 = getRandomNum();
      let operators = ['+', '-', '*', '/'];
      //배열에 랜덤 연산자 뽑음
      let operator = operators[Math.floor(Math.random() * operators.length)];

      let answer;
      //연산자에 맞게 정답 설정
      // num1 = 67 , operator = + , num2 = 7 , answer = 74
      switch (operator) {
        case '+': answer = num1 + num2; break;
        case '-': answer = num1 - num2; break;
        case '*': answer = num1 * num2; break;
        case '/': answer = num1 / num2; break;
      }

      return { num1: num1, num2: num2, operator: operator, answer: answer };
    }

    // 문제 생성 및 화면 출력
    let quizList = document.getElementById('quizList');

    // QUESTION_COUNT 개수 만큼 랜덤 문제 생성
    for (let i = 0; i < QUESTION_COUNT; i++) {
      //만든 질문 문제 q로 선언 (num1,num2,operator,answer)
      let q = makeQuestion();
      //채점을 위해 배열에 저장
      questions.push(q);

      let p = document.createElement('p');

      let qText = document.createElement('span');
      qText.id = 'q' + i;
      qText.textContent = q.num1 + ' ' + q.operator + ' ' + q.num2;

      let input = document.createElement('input');
      input.type = 'text';
      input.id = 'input' + i;

      //div id="quizList" 안에 생성 <p><span id="q0">37 + 82</span><input id="input0"></p>
      p.appendChild(qText);
      p.appendChild(input);
      quizList.appendChild(p);
    }

    // 타이머 진행
    let timerSpan = document.getElementById('timer');

    function tick() {
      timeLeft--;
      timerSpan.textContent = timeLeft;

      if (timeLeft <= 0) {
        gradeAll();
        return; 
      }

      setTimeout(tick, 1000);
    }

    tick();

    // 시간 종료 시 전체 채점
    function gradeAll() {
      let correctCount = 0;

      //questions.push(q) 넣어둔 정답 하나식 비교
      questions.forEach(function (q, i) {
        //인덱스로 해당 문제 찾음 input0, input1.....   q0,q1.....
        let input = document.getElementById('input' + i);
        let qText = document.getElementById('q' + i);
        //사용자가 입력한 값
        let userInput = Number(input.value);
        //정답 비교
        let isCorrect = userInput === q.answer

        //정답이 맞으면 카운트 증가 아니면 취소선
        if (isCorrect) {
          correctCount++;
        } else {
          // 시간 내 못 맞춘 문제: 취소선 + 정답 빨간색 표시
          qText.style.textDecoration = 'line-through';
          input.value = q.answer;
          input.style.color = 'red';
        }
        input.disabled = true;
      });

      document.getElementById('correctCount').textContent = correctCount;
    }

    //다시 버튼 클릭시 새로고침
    document.getElementById('retryBtn').addEventListener('click', function () {
      location.reload();
    });
  </script>
</body>

</html>
