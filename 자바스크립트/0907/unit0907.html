<body>
   <script>
    function getNum(){
        return new Promise((resolve)=>{
            setTimeout(function(){
                let n=Math.floor(Math.random()*10);
                resolve(n);
            },3000);
        })
    }

    getNum().then((n)=>{
        alert(n);
    })
    






   </script>
