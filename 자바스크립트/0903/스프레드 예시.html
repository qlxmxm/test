   <script>
/*
    //JSON(자바스크립트 객체 표기법)

        age:22
    }

    //분할대입

    //...스프레드(spread) 구문 : 배열 내부의 값을 순서대로 펼친다
/*
    const ary=[1,2,3,4,5,6,7,8];
    console.log("ary = " + ary + "<br>");
    console.log(...ary);

    //a,b 매개변수로 주고 두 개 합 출력(console.log)
    //함수명은 func1 -> 화살표함수로
    const func1=function(a,b){
        console.log("a + b = " + a+b + "<br>");
    }
    func1(...ary);
*/

    const ary2=[1,2,3,4,5];
    const [a,...c]=ary2; //배열에서 남은 요소를 변수에 담을 때 스프레드 구문 활용한다.
    console.log(a); //1
    console.log(c); //2345

    const[a1,b1,c1,d1,e1]=ary2;
    console.log(e1); //5

    const ary3=[10,20];
    console.log(ary3); //10,20
    const ary4=[30,40];
    console.log(ary4); //30, 40

    const ary5=[...ary3]; //스프레드 연산자로 배열을 복사함 -> 새로운 배열이 만들어진다
    //ary5[10,20]
    console.log(ary5);

    //ary5 -> 새로운 배열이기 떄문에 ary5를 바꿔도 ary3은 전혀 영향 받지 않음 => 독립적
    ary5[0]=100;
    console.log(ary3);
    console.log(ary5);

    const ary6=[...ary3, ...ary4];
    console.log(ary6);

    //...스프레드(spread) 구문 : iterable구조(배열, 객체, 문자열)
    const obj={
        v1:10,
        v2:20
    }

    const obj2={
        v3:30,
        v4:40
    }

    const obj3={...obj}
    console.log(obj3);

    //obj, obj2 다 펼쳐서 obj4에 저장 후 출력
    const obj4={...obj, ...obj2};
    console.log(obj4);

    //ary8에 ary3을 값 복사해서 저장
    const ary8=[...ary3];
    ary8[0]=100; //스프레드 구문 사용하면 -> 완전한 새로운 배열 생성 -> 기존 배열에 영향을 주지 않는다.
    console.log(ary8);
    console.log(ary3);

    obj3.v1=300;
    console.log(obj3);
    console.log(obj);





   </script>
