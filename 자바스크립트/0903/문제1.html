<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
   <script>
    //1. 3초 후에 랜덤하게 0~9 사이의 숫자를 반환하는 함수 getNum()를 만들어라.
    //그 숫자를 받아서 alert()으로 출력해라. - 콜백함수로 구현

    function getNum(callback){
        setTimeout(function(){
            //Math.random
            let num = Math.floor(Math.random() * 10);
            callback(num);
        },3000);
    }

    getNum(function(num){
        alert(num);
    });
        
    





   </script>

</body>
</html>
