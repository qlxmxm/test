<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <button onclick="on()">Open modal</button>
    <div id="after">
        <h1>Modal</h1>
        자바스크립트 공부<br><br>
        <button onclick="on2()">Close Modal</button>

    </div>
   <script>

    // 원래화면은 open modal버튼밖에 없다.
    // open modal버튼 누르면
    // 아래와같이 모달 창 뜬다
    // close modal누르면 사라진다 
    let fr=document.getElementById("after");
    fr.style.display='none';

    function on(){
        let after=document.getElementById("after");
        after.style.display="block";
    }

    function on2(){
        after.style.display='none'
    }

   </script>

</body>
</html>
