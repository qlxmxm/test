<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    해당 p태그에 대해서만 <p>마우스</p>가 올라갈때 밑줄이 그어지고 <p>마우스</p> 내려갈때 밑줄이 사라진다.
   <script>
    //body부분에 아래 문장을 적고 mouseover mouseout
    //this.style.textDecoration = "underline";
    //this.style.textDecoration = "none"

    let n=document.querySelectorAll('p');
    n.forEach(function(a){
        a.addEventListener('mouseover', function(){
            this.style.textDecoration = "underline"; // 마우스 올라가면 밑줄
        });

        a.addEventListener('mouseout', function(){
            this.style.textDecoration = "none"; // 마우스 내려가면 밑줄 제거
        });
    });

   </script>

</body>
</html>
