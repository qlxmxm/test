<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <div>
        <span id="q1">5*3</span><input type="text" id="ans1">
    </div>
    <div>
        <span id="q2">1+2*3</span><input type="text" id="ans2">
    </div>
    <div>
        <span id="q3">12*2</span><input type="text" id="ans3">
    </div>

    <button onclick="cal()">결과</button>
    <div id="count"></div>
   <script>
    //결과버튼을 누르면 여러분이 작성한 답이 왼쪽에 쓴 수식과 맞는지
    //확인해서 틀리면 취소선 ,
    //맞으면 맞은 답의 개수 출력

    //1. cal함수 구현 - input태그 객체 추출, span태그 객체 추출
    function cal(){
        let span1=document.getElementsByTagName("span");
        let input1=document.getElementsByTagName("input");
        
        let count = 0;

        //2. 여러분이 작성한 답과 왼쪽에 쓴 수식 비교하기(같은기능이므로 반복문 처리함)
        for(let i=0;i<span1.length;i++){
            if(input1[i].value == eval(span1[i].innerText)){
                span1[i].style.textDecoration = 'none'
                count++; //맞은개수 1 더한다
            }else{
                span1[i].style.textDecoration='line-through';
            }
        }
        //3. 맞은 갯수 출력
        //div태그객체 추출해야 그 태그안에 맞은개수 삽입
        document.getElementById("count").innerHTML= `맞은 개수 : ${count}`;
    }

   </script>

</body>
</html>
