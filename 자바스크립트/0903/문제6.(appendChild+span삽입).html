<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <div id="my"></div>
   <script>
    //6. 다음 태그가 있을 때, <div>태그가 출력되는 영역에 “<span>hi</span>삽입하여 hi를 출력하고자 하는 코드를 작성해라. (appendChild 이용)
    //1. div객체 추출
    let my=document.getElementById("my");
    //2. span태그 생성
    let hi=document.createElement("span");
    //3. span태그 사이에 "hi"
    hi.innerHTML='hi';
    //4. appendChild로 div에 삽입
    my.appendChild(hi);
    

   </script>

</body>
</html>
