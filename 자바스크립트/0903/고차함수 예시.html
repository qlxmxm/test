<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
   <script>
    //고차함수(Higher-order Function)(함수를 매개변수로 받는함수/함수를 리턴하는 함수)
    function cook(food, callback){
        document.write(`${food} 요리 시작한다~`);
        
        setTimeout(()=>{
            document.write(`${food} 요리끝`);
            callback();
        },2000);
    }

    cook('파스타',()=>{
        document.write('먹어');
    });




   </script>

</body>
</html>
