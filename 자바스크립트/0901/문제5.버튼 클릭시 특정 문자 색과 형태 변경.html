<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>

    <p>자신이 하는 일을 <span id="target">좋아하게</span> 되는 것</p>
    <button onclick="ch()">변경</button>

    <script>
        //5. “자신이 하는 일을 좋아하게 되는 것”이라는 문자열을 주고 
        //“변경”이라는 버튼을 클릭했을 때 문자열의 “좋아하게”되는 부분의 색은 
        //violet, width는 4em, block형태로 변경해라.
        function ch() {
            let target = document.getElementById("target");
            target.style.color = "violet";
            target.style.width = "4em";
            target.style.display = "block";
        }
    </script>
</body>

</html>
