<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <h1>라면을 끓이는 순서</h1>
    <hr>

    <!-- 방식 1: onclick 속성 -->
    <ol type="A" id="ol" onclick="this.style.backgroundColor='yellow'">
        <li>물 끓이기</li>
        <li>라면,스프 넣기</li>
        <li>계란 넣기</li>
        <li>맛있게 먹기</li>
    </ol>
    <script>

        let ol = document.getElementById('ol');

        // 방식 2: onclick 프로퍼티에 함수 대입
        ol.onclick = function () {
            ol.style.backgroundColor = 'yellow';
        };

        // 방식 3: addEventListener 방식
        ol.addEventListener('click', function () {
            ol.style.backgroundColor = 'yellow';
        });
    </script>
</body>

</html>
