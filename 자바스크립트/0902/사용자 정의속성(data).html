<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <!--사용자 정의속성(date)-->
    <div class="div1">
        <h2>주문</h2>
        <div class="div2">
            <h2 data-num="에스프레소" data-price="4500">더블샷</h2>
            <h2 data-num="라떼" data-price="5000">라떼</h2>
            <h2 data-num="아메리카노" data-price="4700">아메리카노</h2>
        </div>

        <p><span id="order">메뉴없음</span>
            <span id="price">0</span>원
        </p>
    </div>
    
   <script>

    //h2 객체, order, price
    let menu=document.querySelectorAll(".div1 h2");
    let order=document.getElementById("order");
    let price=document.getElementById("price");

    for(let i=0;i<menu.length;i++){
        menu[i].addEventListener('click', function(){

            // let menu2=this.dataset.num; //선택한 커피메뉴
            // let price2=this.dataset.price; //선택한 커피가격
            // console.log(menu2);
            // console.log(price2);

            //data-num-menu
            let menu2=this.dataset.numMenu; //선택한 커피메뉴

            //data 속성 뒤에 영문자 2개이면
            //앞은 그대로, 뒤부분은 맨앞은 대문자로 써야함(카멜표기법)

            //let price2=this.dataset.price;
            let price2=this.dataset['price']; //선택한 커피가격


            //메뉴는 order, 가격은 price에 띄우기
            order.innerText=menu2;
            price.textContent=price2;

        })
    }
