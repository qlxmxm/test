<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <h3>계산기</h3>
    <hr />
    <input type="text" value="0" id="dis" />
    <table>
        <tr>
            <td><button onclick="clearf()">C</button></td>
            <td><button onclick="re()">=</button></td>
        </tr>
        <tr><td><button name="num" value="7" >7</button></td><td><button name="num" value="8">8</button></td><td><button name="num" value="9">9</button></td><td><button name="op" value="/">/</button></td></tr>
        <tr><td><button name="num" value="4">4</button></td><td><button name="num" value="5">5</button></td><td><button name="num" value="6">6</button></td><td><button name="op" value="*">*</button></td></tr>
        <tr><td><button name="num" value="1">1</button></td><td><button name="num" value="2">2</button></td><td><button name="num" value="3">3</button></td><td><button name="op" value="-">-</button></td></tr>
        <tr><td><button name="num" value="0">0</button></td><td><button name="op"value="+">+</button></td></tr>
    </table>
   <script>
    //숫자를 클릭할때마다 <input type="text" value="0" id="dis" /> - 이 위치에 뜨게끔 구현
    //ex) 3+4=7일 때,
    //3이라는 버튼을 클릭하면 input type="text"창에 3이라고 뜨고 , + 버튼은 안뜨고 , 4버튼 클릭하면 4가 text창에 떠야함
    //그리고 = 버튼은 안뜨고, =버튼 누른후 7이 text창에 떠야함
    //즉, 수는 input type="text" 창에 떠야함

    let table=document.querySelector('table');
    let button=table.querySelectorAll('button');

    button.forEach(function(btn){
        btn.addEventListener('click', function(){
            // dis.value += btn.value;
            if(btn.name == "op"){
                let last = dis.value.slice(-1);
                if(last == '+' || last == '-' || last == '*' || last == '/'){
                    dis.value = dis.value.slice(0, -1) + btn.value;
                    return;
                };
            };
            dis.value += btn.value;            
        });
    });

    function clearf(){
        dis.value = null;
    };

    function re(){
        dis.value = eval(dis.value);
    };
       
   </script>
</body>
</html>
