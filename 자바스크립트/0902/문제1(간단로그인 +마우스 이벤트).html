<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <!--구조만들고 태그로 묶고 <scrip> 설정-->
    <h3>로그인</h3>
    <form name="login">
        <div>아이디 <br>
            <input type="text" name="userId" placeholder="아이디를 입력해주세요.">
        </div>

        <div>패스워드<br>
            <input type="password" name="userPw" placeholder="비밀번호를 입력해주세요.">                    
        </div>

        <button id="btn1" type="button">로그인</button>
    </form>
   <script>
    //다음을 보고 웹 페이지를 작성해라
    //로그인 버튼은 pink색이었다가 마우스를 대면 tomato색으로변한다.
    //아이디는 "자바" 패스워드는 "1234"이어야 로그인 되고,
    //둘중 하나라도 틀리게 입력하면 "다시 입력" 이라는 경고창이 뜬다.
    let userId=document.login.userId;
    let userPw=document.login.userPw;

    let btn1=document.getElementById("btn1");

    btn1.style.backgroundColor='pink';

    btn1.addEventListener('mouseover', function(){
        this.style.backgroundColor='tomato';
    })

    btn1.addEventListener('click', function(){
        if(userId.value!='자바' || userPw.value!='1234') {
            alert("다시 입력");
        }
        else{
            alert("로그인 성공");
        }
    })
    
   </script>

</body>
</html>
