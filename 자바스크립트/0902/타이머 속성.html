<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
   <script>
    //**1초마다 n을 1씩 증가시키면서 출력하는 함수**

    let n=1;

    //setInterval(func, delay)
    let out=setInterval(function(){
        document.write(n+"초 지났다" + "<br>");
        n++;
    },1000);

    //10초 경과 후 타이머 멈추게 구현
    setTimeout(function(){
        clearInterval(out);
    },10000);
    
   </script>

</body>
</html>
