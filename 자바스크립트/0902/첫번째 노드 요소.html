<!DOCTYPE html>

<body>
    <div id="frame">
        <!--자바스크립트-->
        <p>one</p>
        <p>two</p>
    </div>

    <script>
        let f1=document.getElementById("frame");

        let first=f1.firstElementChild;

        document.write(f1.firstChild + "<br>");
        document.write(first + "<br>");

        //firstChild : 모든 노드 중 첫번째(텍스트, 주석포함) 공백, 줄바꿈 다 포함
        //firstElementChild : 요소 노드 중 첫번째 (텍스트, 공백 무시)






    </script>
    
</body> 
</html>
