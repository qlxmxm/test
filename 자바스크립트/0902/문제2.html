<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <div class="c">
        색 이벤트
    </div>
    <script>
        //2 “색 이벤트” 라는 문자열에 더블클릭하면 배경색을 pink, 마우스 커서가 객체 영역에서 벗어나면 배경색을 blue로 설정해라.
        let f=document.querySelector(".c");
        //고전
        f.ondblclick = function(){
            f.style.backgroundColor='pink';
        }

        f.onmouseout = function(){
            f.style.backgroundColor='blue';
        }




    </script>
    
</body> 
</html>
