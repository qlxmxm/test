<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <form name="test">
        <input type="text" name="test2">
    </form>
    <div id="div1"></div>

    <script>
        //input태그 추출
        let n=document.test.test2;

        let n2=document.getElementById("div1");

        //n에 키보드를 입력했을 때의 이벤트(고전 이벤트방식)
        n.onkeyup=function(){
            let n3=this.value;
            //div 영역에 n3띄우기
            n2.textContent=n3;
        }

    </script>
    
</body> 
</html>
