<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <!--페이지이동이 기본동작-->
    <!--확인 onclikck = return true-->
    <!--취소 onclikck = return false-->
    <a href="http://www.naver.com" onclick="return on()">네이버로 이동할거냐</a><br>

    <input type="checkbox">커피<br>
    <input type="checkbox" onclick="no(event)">빵<br>


    <script>
        function on(){
            let n=confirm('정말 네이버로 이동할거냐?'); //확인버튼 true 취소버튼 false
            return n;
        }

        //preventDefault : 기본동작 취소시키는 메소드 / defaultPrevented : 기본동작이 취소되었는지 확인
        function no(e){
            e.preventDefault(); //이벤트의 디폴트 행동 강제취소
        }

    </script>
    
</body> 
</html>
