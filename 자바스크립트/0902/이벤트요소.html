<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>    
    <p id="mouse1">마우스</p>
    <!-- html 인라인 이벤트에서는 매개변수명은 event로 -->
    <button onclick="on(event)">클릭</button>

    <script>
        function on(e){ //e:현재 발생한 이벤트 객체
            let event1=e.type + "<br>" //이벤트 종류
            + e.target + "<br>" //어떤 태그객체에서 이벤트가 발생했는지
            + e.currentTarget + "<br>" + e.defaultPrevented;
            //이벤트가 연결된 요소          기본동작이 취소되었는지의 여부(취소: true / 취소 x : false)

            document.getElementById("mouse1").innerHTML=event1;


            


        }



    </script>
    
</body> 
</html>
