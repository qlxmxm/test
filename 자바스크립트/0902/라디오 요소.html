<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <form name="test" class="t">
        <input type="text" name="first" value="00111" disabled>
        <input type="text" name="second">

        <input type="radio" name="g1" id="male">
        <label for="male">남</label>

        <input type="radio" name="g1" id="female">
        <label for="female">여</label>
    </form>
    <script>

        let n=document.test.second;
        //document.write(n + "<br>");

        let male=document.getElementById("male");
        let female=document.getElementById("female");

        n.onkeyup=function(){
            let num=this.value;
            if(num >=1 && num<=4){
                if(num==1 | num==2){
                male.checked=true; //체크가 된상태
                female.checked=false;
                }
                else{
                    male.checked=false;
                    female.checked=true;
                }
            }
        }




    </script>
    
</body> 
</html>
