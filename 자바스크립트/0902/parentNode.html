<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>    
    <div class="frame">
        <h1 class="head">제목</h1>
        <p class="p">
            11일 엑스(구 트위치) 등에 따르면 최근 사회관계망서비스(SNS)에서는
            "올림픽이 이렇게 조용한 적 있었냐", "왜 이렇게 올림픽을 하는 것 같지 않냐",
            "국내 선수 올림픽 영상 진짜 귀신같이 자른다" 등의 불만이 잇따르고 있다.
        </p>
        <button id="bu1">클릭</button>
    </div>

    <script>
        //div태그, button태그 객체 추출
        let f=document.querySelector(".frame");
        let bu1=document.getElementById("bu1");

        //이벤트 함수식 -> 버튼클릭시 발생하는 이벤트
        bu1.addEventListener('click',function(){
            //부모노드 선택
            this.parentNode.style.backgroundColor='yellow';
            this.parentNode.style.border='3px solid blue';
        })
    </script>
    
</body> 
</html>
