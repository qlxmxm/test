<!DOCTYPE html>
<head>
</head>
<body>
    식 <input type="text" id="susik"><br>
    값 <input type="text" id="result" readonly><br>
    <input type="button" value="계산" onclick="calcu()">
<script>
    //식을 입력해서 계산버튼 누르면 계산 결과값이 값이라는 위치에 뜨도록 구현
    function calcu(){
        let susik=document.getElementById('susik');
        let result=document.querySelector("#result");

        //document.write(susik.value); //input태그 에서 .value -> 텍스트 창에 입력한 실질값
        result.value=eval(susik.value);

    } 

  
</script>
</body>
</html>
