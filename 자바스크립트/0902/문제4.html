<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <div class="c">
        자바스크립트
    </div>
    <script>
        //4 자바스크립트 클리하면 변경된다
        //고전이벤트방식과 addEventListener를 사용하기
        let f=document.querySelector(".c");
        //고전
        f.onclick = function(){
            f.style.backgroundColor='black';
            f.style.color='yellow';
        }
        //addEventListener를
        f.addEventListener('click',function(){
            f.style.backgroundColor='black';
            f.style.color='yellow';
        })




    </script>
    
</body> 
</html>
