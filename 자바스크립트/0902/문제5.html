<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <h3>정보입력</h3>
    <form id="info">
        <p>이름 <input type="text" id="name"></p>
        <p>주소 <input type="text" id="addr"></p>

        <input type="submit" value="정보입력">
    </form>

    <p id="output"></p>

    <!-- <p id="output"><p>홍길동, 용산구</p></p>-->
    <script>

        //form name, addr, output
        let form=document.querySelector("#info");
        let name=document.querySelector("#name");
        let addr=document.querySelector("#addr");
        let output=document.querySelector("#output");

        //submit버튼을 눌렸을 때 서버로 전송되는 이벤트 => onsubmit 이벤트
        form.onsubmit=function(e){
            e.preventDefault(); // 페이지 새로고침 방지 -> 기본 제출 동작 막고있음

            //p태그 동적생성
            let p=document.createElement("p"); //<p>홍길동 ,용산구</p>
            p.textContent = name.value + " , " + addr.value;

            output.appendChild(p);
        }




    </script>
    
</body> 
</html>
