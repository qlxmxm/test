<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
   <script>

    //JSON
    const profile={
        name:'tom',
        age:30
    }
    const msg=`내 이름은 ${profile.name} 이고 나이는 ${profile.age} 살이다`;
    document.write("msg = " + msg + "<br>");

    //2. 분할 대입(코드간결/ 가독성 업/ 필요한 값만 뽑아낼 수 있음)
    const profile2={
        name2:'jack',
        age2:40,
        adr2:'seoul'
    }
    //const {속성명} = 객체명
    //변수명=속성명이 정확히 일치해야 값이 들어온다
    //순서는 상관이 없다
    const {age2, adr2, name2}=profile2;

    const msg2=`내 이름은 ${name2} 이고 나이는 ${age2} 살이고 주소는 ${adr2} 이다.`;
    document.write("msg2 = " + msg2 + "<br>");
    document.write("adr2 = " + adr2 + "<br>");

    // const name2=profile2.name2;
    // const age2=profile2.age2;
    // const adr2=profile2.adr2;

    //변수명:별칭
    const {adr2:address, name2:proName} = profile2;
    const msg3=`내 이름은 ${proName} 이고 주소는 ${address} 이다.`;
    document.write("msg3 = " + msg3 + "<br>");

    //배열
    const ary=['gildong', 34];
    const msg4=`내 이름은 ${ary[0]} 이고 나이는 ${ary[1]} 살이다.`
    document.write("msg4 = " + msg4 + "<br>");

    //분할대입
    const [name,age] = ary;
    const msg5=`내 이름은 ${name} 이고 나이는 ${age} 살이다.`;
    document.write("msg5 = " + msg5 + "<br>");

    const[age22]=ary; //배열에서 분할대입은 순서 기준 이므로 변수 하나만 주면 [0] 값 뜸
    document.write("age22 = " + age22 + "<br>");

    const[,age222]=ary; //두번쨰 값 출력원한다면, , 로 구분해서 출력
    document.write("age222 = " + age222 + "<br>");

   </script>

</body>
</html>
