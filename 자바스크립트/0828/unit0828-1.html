<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <button onclick="food(this.value)" value="food1">라면</button>
    <button onclick="food(this.value)" value="food2">떡볶이</button>
    <button onclick="food(this.value)" value="food3">김밥</button>

    <script>
        let restaura='신전떡볶이';

        //객체=변수+함수

        //생성자 함수를 만들어서 변수들 다 초기화하고
        //result 함수를 구현하는데 - 분식집(전역변수 출력)과 선택한 메뉴 정보들 다 출려하기
        function Menu(title, price, num){
            this.title=title;
            this.price=price;
            this.num=num;

            this.result=function(){
                alert('분식집' + restaura);
                alert('선택한 메뉴 정보' + this.title + ',' + this.price + ',' + this.num);
            }
        }


        //임의로 객체 3개 생성
        let food1=new Menu('치즈라면','5000원',2)
        let food2=new Menu('떡볶이라면','6000원',2)
        let food3=new Menu('치즈김밥','7000원',1)

        function food(e){
            if(e=='food1'){
                food1.result(); //객체명.함수명();
            }
            else if(e=='food2'){
                food2.result();
            }
            else if(e=='food3'){
                food3.result();
            }
        }
    </script>

</body>
</html>
