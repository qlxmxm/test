<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    </style>
</head>
<body>
    <div id="main">
        <h2>오늘 계획표</h2>
        <input type="text" id="in" placeholder="할 일을 입력하세요"><button onclick="insertTodo()">추가</button>
        <div id="list"></div>
    </div>
    <p>총 할 일:<span id="all">0</span>개</p><br>
    <button id="retryBtn">전체 삭제</button>

    <script>
        //list, in 객체추출
        let lists=document.getElementById("list");
        let ins=document.getElementById("in");
        let allSpan=document.getElementById("all")

        const KEY_ENTER=13; //enter의 keycode값

        const all=0;
        let allTest = all

        ins.addEventListener('keypress',function(e){
            if(e.keyCode===KEY_ENTER){
                insertTodo();
                ins.value='';  //enter입력 후 입력창은 공백으로 만든다
            }
        });

        function insertTodo(){
            let todoDiv=document.createElement("div");

            todoDiv.innerHTML=`${ins.value} <button class="btn1">x</button>`

            lists.appendChild(todoDiv);
            ins.value='';
            allTest++;
            allSpan.textContent = allTest;
        }

        lists.addEventListener('click',function(e){
            if(e.target.classList.contains('btn1')){
                let parent=e.target.parentElement;
                parent.remove();
                allTest--;
                allSpan.textContent = allTest;
            }
        })

        document.getElementById('retryBtn').addEventListener('click', function () {
            location.reload();
        });

    </script>

   


</body>
</html>
