<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <script>
        //var let const
        var name='gildong'; //재선언 가능, 값변경 가능
        name='juli';
        console.log(name);

        let name='gildong'; //재선언 불가능, 값변경 가능
        name='juli'; 
        console.log(name);

        const name='gildong'; //재선언 불가능, 값변경 불가능
        name='juli'; 
        console.log(name);


    </script>
</body>
</html>
