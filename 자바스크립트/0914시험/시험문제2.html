<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
  <button id="startBtn">시작</button>
  <h2>
    <span id="num1">0</span>
    <span id="num2">0</span>
    <span id="num3">0</span>
  </h2>

  <script>
    let stBtn = document.getElementById('startBtn');

    let num1Span = document.getElementById('num1');
    let num2Span = document.getElementById('num2');
    let num3Span = document.getElementById('num3');

    function start(){
        return new Promise((resolve)=>{
            setTimeout(function(){
                let n=Math.floor(Math.random()*10);
                num1Span.textContent = n;
            },1000);
            setTimeout(function(){
                let n=Math.floor(Math.random()*10);
                num2Span.textContent = n;
            },2000);
            setTimeout(function(){
                let n=Math.floor(Math.random()*10);
                num3Span.textContent = n;
            },3000);
        })
    }

    function num1cl(){
        let n=Math.floor(Math.random()*3);
        num1Span.textContent = n;
        alert("실패")
    }

    function num2cl(){
        let n=Math.floor(Math.random()*3);
        num2Span.textContent = n;
        alert("실패")
    }

    function num3cl(){
        let n=Math.floor(Math.random()*3);
        num3Span.textContent = n;
        alert("실패")
    }

    stBtn.addEventListener('click',function(e){
        start();
    })


    
    num1Span.addEventListener('click',function(e){
        if(parseInt(num1Span.textContent) == parseInt(num2Span.textContent) == parseInt(num3Span.textContent)){
            alert("성공")
        }else{
            num1cl();            
        }        
    })

    num2Span.addEventListener('click',function(e){
        if(parseInt(num1Span.textContent) == parseInt(num2Span.textContent) == parseInt(num3Span.textContent)){
            alert("성공")
        }else{
            num2cl();            
        }  
    })

    num3Span.addEventListener('click',function(e){
        if(parseInt(num1Span.textContent) == parseInt(num2Span.textContent) == parseInt(num3Span.textContent)){
            alert("성공")
        }else{
            num3cl();            
        }  
    })



  </script>
</body>

</html>
