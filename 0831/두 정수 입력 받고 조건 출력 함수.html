<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <script>
        //두 정수 입력받아 두 수가 같으면 두 수 곱, 다르면 합을 출력하는 함수를 구현해라.
        let a = parseInt(prompt("첫번쨰 정수를 입력하세요"));
        let b = parseInt(prompt("두번쨰 정수를 입력하세요"));

        if (a == b) {
            document.write(a * b);
        }
        else if (a != b) {
            document.write(a + b);
        }
    </script>
</body>

</html>
