<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <script>
        //생성자 함수만들어서 매개변수에 name,score 추가
        //생성자 함수안에 함수를 만들어
        //90점 이상이면 A 80점 이상이면 B 그 이외 F
        //두개 객체 만들고 결과값 출력
        function sc(name, score) {
            this.name = name;
            this.score = score;
            this.t = function () {
                if (score >= 90) {
                    return 'A';
                }
                else if (score >= 80) {
                    return 'B';
                }
                else {
                    return 'F';
                }
            };
        }

        let a = new sc('juli', 50);;
        let b = new sc('tom', 100);

        document.write(a.t());
        document.write(b.t());
    </script>
</body>

</html>
