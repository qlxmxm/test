<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <script>
        //3. Prompt() 함수를 이용하여 문자열을 입력해 “,” 를 기준으로 문자를 분할하여 출력해라.
        let str = prompt("문자열을 입력하세요");
        let a = str.split(',');

        for (let i = 0; i < a.length; i++) {
            document.write(a[i] + "<br>");
        }
    </script>
</body>

</html>
