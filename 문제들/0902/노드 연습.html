<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <div class="frame">
        <h1>javascript</h1>
        <div class="c">
            <h2>css</h2>
            <p>  
            8일 국내 및 글로벌 시장에 론칭한 악마단 돌겨억은 출시 3일만인 지난 
            11일 구글플레이 인기 게임 순위 1위에 기록한 데 이어 16일에는 애플 앱스토어에서도 1위를 차지했다. 
            악마단 돌겨억은 지난 7일까지 싱가포르와 호주에 소프트론칭을 실시해 게임성을 검증한 바 있다.
            </p>
        </div>
    </div>
    <script>
        let f1=document.querySelector(".frame");
        f1.firstChild.textContent='처음으로 추가된 텍스트';
        f1.lastChild.textContent='마지막에 추가된 텍스트';

        let c1=document.querySelector('.c');
        let h2=document.querySelector('.c h2');

        //p태그 선택 -> h2태그의 다음 형제 노드
        h2.nextElementSibling.style.border='2px solid red'; //2px 두께의 실선 red색

        //div class="c 의 앞에 있는 형제노드 = h1 태크"
        c1.previousElementSibling.style.border='2px dotted blue';

    </script>
    
</body> 
</html>
