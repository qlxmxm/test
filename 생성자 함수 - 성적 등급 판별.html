<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <script>
        function sc(name, score) {
            this.name = name;
            this.score = score;
            this.t = function () {
                if (score >= 90) {
                    return 'A';
                }
                else if (score >= 80) {
                    return 'B';
                }
                else {
                    return 'F';
                }
            };
        }

        let a = new sc('juli', 50);;
        let b = new sc('tom', 100);

        document.write(a.t());
        document.write(b.t());
    </script>
</body>

</html>
